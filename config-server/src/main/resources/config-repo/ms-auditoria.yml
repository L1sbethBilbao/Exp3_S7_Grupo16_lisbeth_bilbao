# Config centralizada ms-auditoria (consumidor Kafka Semana 7)
server:
  port: 8094

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

spring:
  kafka:
    bootstrap-servers: 52.204.221.241:29092,52.204.221.241:39092,52.204.221.241:49092
    consumer:
      group-id: ms-auditoria
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: cl.duoc.bancoxyz.ms.auditoria.events.TransaccionEvento
        spring.json.use.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    cl.duoc.bancoxyz.ms.auditoria: INFO
    org.springframework.kafka: INFO
